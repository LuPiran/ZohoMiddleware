services:
  zoho-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zoho-backend
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      SERVE_FRONTEND: "false"
      TRUST_PROXY: "1"
      FRONTEND_URL: ${FRONTEND_URL:-https://h-portaldoconsultor.tegrapharma.com}
      JSON_BODY_LIMIT: 25mb
      UPLOAD_BODY_LIMIT: 25mb
      MYSQL_HOST: host.docker.internal
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: portaldoconsultor
      MYSQL_USER: portaluser
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - zoho_uploads:/app/uploads
      - zoho_logs:/app/logs
    # Apache (apih-portaldoconsultor) encaminha para esta porta
    ports:
      - "127.0.0.1:3335:3000"
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - zoho-network
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  zoho-admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://apih-portaldoconsultor.tegrapharma.com}
        VITE_ENTRA_CLIENT_ID: ${VITE_ENTRA_CLIENT_ID}
        VITE_ENTRA_TENANT_ID: ${VITE_ENTRA_TENANT_ID}
        VITE_ENTRA_REDIRECT_URI: ${VITE_ENTRA_REDIRECT_URI:-https://h-portaldoconsultor.tegrapharma.com}
        VITE_GOOGLE_MAPS_KEY: ${VITE_GOOGLE_MAPS_KEY}
        # Botão "Avançar tempo" na tela do lead — ferramenta de teste, NUNCA
        # true em produção (ver ALLOW_LEAD_TIME_TRAVEL no backend/.env.example)
        VITE_ALLOW_LEAD_TIME_TRAVEL: ${VITE_ALLOW_LEAD_TIME_TRAVEL:-false}
    container_name: zoho-admin
    # Apache (h-portaldoconsultor) já termina o HTTPS e encaminha para cá
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      zoho-backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - zoho-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  zoho-network:
    driver: bridge

volumes:
  zoho_uploads:
  zoho_logs:
