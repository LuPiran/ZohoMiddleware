services:
  zoho-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zoho-backend
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      SERVE_FRONTEND: "false"
      TRUST_PROXY: "1"
      FRONTEND_URL: ${FRONTEND_URL:-https://portal.autofullall.com}
      JSON_BODY_LIMIT: 2mb
      UPLOAD_BODY_LIMIT: 25mb
    volumes:
      - zoho_uploads:/app/uploads
      - zoho_logs:/app/logs
    # Backend só na rede interna — acesso externo via nginx do admin
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - zoho-network
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  zoho-admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        # Same-origin via nginx proxy /v1 → backend
        VITE_API_URL: ""
        VITE_ENTRA_CLIENT_ID: ${VITE_ENTRA_CLIENT_ID}
        VITE_ENTRA_TENANT_ID: ${VITE_ENTRA_TENANT_ID}
        VITE_ENTRA_REDIRECT_URI: ${VITE_ENTRA_REDIRECT_URI:-https://portal.autofullall.com}
        VITE_GOOGLE_MAPS_KEY: ${VITE_GOOGLE_MAPS_KEY}
    container_name: zoho-admin
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Certificado Origin Cloudflare (Full strict)
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
    depends_on:
      zoho-backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - zoho-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  zoho-network:
    driver: bridge

volumes:
  zoho_uploads:
  zoho_logs:
