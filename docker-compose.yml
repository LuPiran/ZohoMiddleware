services:
  zoho-backend:
    build: ./backend
    container_name: zoho-backend
    ports:
      - "3004:3000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - FRONTEND_URL=http://localhost:8081
      - SERVE_FRONTEND=false
      - CEP_PROVIDER=contracted
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    restart: unless-stopped
    networks:
      - zoho-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3

  zoho-admin:
    build: ./admin
    container_name: zoho-admin
    ports:
      - "8081:80"
    depends_on:
      - zoho-backend
    restart: unless-stopped
    networks:
      - zoho-network
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  zoho-network:
    driver: bridge

volumes:
  uploads:
  logs:
