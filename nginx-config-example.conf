# Configuração Nginx para Produção com Domínio
# Salve este arquivo em: /etc/nginx/sites-available/zoho
# Depois crie um link simbólico: ln -s /etc/nginx/sites-available/zoho /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    
    # Substitua pelo seu domínio
    server_name seudominio.com www.seudominio.com;

    # Logs
    access_log /var/log/nginx/zoho-access.log;
    error_log /var/log/nginx/zoho-error.log;

    # Tamanho máximo de upload (ajuste conforme necessário)
    client_max_body_size 50M;

    # Frontend - Servir a aplicação React
    location / {
        proxy_pass http://localhost:8081;
        proxy_http_version 1.1;
        
        # WebSocket support (se necessário)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Headers importantes
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Backend API - Todas as requisições /api vão para o backend
    location /api {
        proxy_pass http://localhost:3004;
        proxy_http_version 1.1;
        
        # Headers importantes
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts maiores para operações longas
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Uploads - Endpoint específico para uploads
    location /uploads {
        proxy_pass http://localhost:3004;
        proxy_http_version 1.1;
        
        # Headers importantes
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts maiores para uploads
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Permitir uploads grandes
        client_max_body_size 50M;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://localhost:3004;
        access_log off; # Não logar health checks
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Desabilitar servidor version
    server_tokens off;
}

